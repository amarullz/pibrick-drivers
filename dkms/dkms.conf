# ============================================================================
# piBrick PocketCM5 DKMS configuration
# ============================================================================

PACKAGE_NAME="pibrick-drivers"
PACKAGE_VERSION="1.0.0"

# --------------------------------------------------------------------------
# Kernel modules
# --------------------------------------------------------------------------

BUILT_MODULE_NAME[0]="panel-pibrick"
BUILT_MODULE_LOCATION[0]="panel"

BUILT_MODULE_NAME[1]="pibrick-battery"
BUILT_MODULE_LOCATION[1]="power"

BUILT_MODULE_NAME[2]="pibrick-charger"
BUILT_MODULE_LOCATION[2]="power"

BUILT_MODULE_NAME[3]="hyn_ts"
BUILT_MODULE_LOCATION[3]="touch/hyn_ts"

# --------------------------------------------------------------------------
# Installation
# --------------------------------------------------------------------------

DEST_MODULE_LOCATION[0]="/updates"
DEST_MODULE_LOCATION[1]="/updates"
DEST_MODULE_LOCATION[2]="/updates"
DEST_MODULE_LOCATION[3]="/updates"

# --------------------------------------------------------------------------
# Build
# --------------------------------------------------------------------------
#
# The repository Makefile is responsible for building the kernel modules.
#
# DKMS supplies:
#
#     kernelver
#
# as the target kernel version.
#

MAKE[0]="make modules KDIR=/lib/modules/${kernelver}/build"

# --------------------------------------------------------------------------
# Cleanup
# --------------------------------------------------------------------------

CLEAN="make clean KDIR=/lib/modules/${kernelver}/build && make -C touch/hyn_ts clean KDIR=/lib/modules/${kernelver}/build"

# --------------------------------------------------------------------------
# DKMS lifecycle
# --------------------------------------------------------------------------

AUTOINSTALL="yes"
